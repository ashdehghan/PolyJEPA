<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 150" font-family="-apple-system,Helvetica Neue,Arial,sans-serif">
  <rect x="0" y="0" width="260" height="150" rx="8" fill="#ffffff"/>
  <g stroke="#b9bec4" stroke-width="1.4">
    <line x1="130" y1="78" x2="130" y2="34"/>
    <line x1="130" y1="78" x2="180" y2="56"/>
    <line x1="130" y1="78" x2="180" y2="100"/>
    <line x1="130" y1="78" x2="130" y2="122"/>
    <line x1="130" y1="78" x2="80" y2="100"/>
    <line x1="130" y1="78" x2="80" y2="56"/>
  </g>
  <!-- neighbors: masked + target (predict their pooled embedding) -->
  <g>
    <g fill="none" stroke="#1a1a1a" stroke-width="1.4" stroke-dasharray="3 2.5">
      <circle cx="130" cy="34" r="15"/><circle cx="180" cy="56" r="15"/>
      <circle cx="180" cy="100" r="15"/><circle cx="130" cy="122" r="15"/>
      <circle cx="80" cy="100" r="15"/><circle cx="80" cy="56" r="15"/>
    </g>
    <g fill="#3a3a3a" stroke="#1a1a1a" stroke-width="1.2">
      <circle cx="130" cy="34" r="10"/><circle cx="180" cy="56" r="10"/>
      <circle cx="180" cy="100" r="10"/><circle cx="130" cy="122" r="10"/>
      <circle cx="80" cy="100" r="10"/><circle cx="80" cy="56" r="10"/>
    </g>
  </g>
  <!-- focal visible -->
  <circle cx="130" cy="78" r="14" fill="#ffffff" stroke="#1a1a1a" stroke-width="2.2"/>
  <text x="130" y="82" text-anchor="middle" font-size="12" font-style="italic" font-weight="700" fill="#1a1a1a">v</text>
</svg>
