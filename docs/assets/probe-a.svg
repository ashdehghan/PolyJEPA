<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 150" font-family="-apple-system,Helvetica Neue,Arial,sans-serif">
  <rect x="0" y="0" width="260" height="150" rx="8" fill="#ffffff"/>
  <!-- edges -->
  <g stroke="#b9bec4" stroke-width="1.4">
    <line x1="130" y1="78" x2="130" y2="34"/>
    <line x1="130" y1="78" x2="180" y2="56"/>
    <line x1="130" y1="78" x2="180" y2="100"/>
    <line x1="130" y1="78" x2="130" y2="122"/>
    <line x1="130" y1="78" x2="80" y2="100"/>
    <line x1="130" y1="78" x2="80" y2="56"/>
  </g>
  <!-- neighbors visible -->
  <g fill="#ffffff" stroke="#6b7280" stroke-width="1.3">
    <circle cx="130" cy="34" r="11"/><circle cx="180" cy="56" r="11"/>
    <circle cx="180" cy="100" r="11"/><circle cx="130" cy="122" r="11"/>
    <circle cx="80" cy="100" r="11"/><circle cx="80" cy="56" r="11"/>
  </g>
  <!-- focal: masked + target -->
  <circle cx="130" cy="78" r="20" fill="none" stroke="#1a1a1a" stroke-width="1.6" stroke-dasharray="4 3"/>
  <circle cx="130" cy="78" r="14" fill="#3a3a3a" stroke="#1a1a1a" stroke-width="1.3"/>
  <text x="130" y="82" text-anchor="middle" font-size="12" font-style="italic" font-weight="700" fill="#ffffff">v</text>
</svg>
