<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 150" font-family="-apple-system,Helvetica Neue,Arial,sans-serif">
  <rect x="0" y="0" width="260" height="150" rx="8" fill="#ffffff"/>
  <!-- 1-hop edges -->
  <g stroke="#b9bec4" stroke-width="1.4">
    <line x1="130" y1="75" x2="92" y2="48"/>
    <line x1="130" y1="75" x2="168" y2="48"/>
    <line x1="130" y1="75" x2="130" y2="116"/>
    <!-- 1-hop to 2-hop -->
    <line x1="92" y1="48" x2="58" y2="28"/>
    <line x1="168" y1="48" x2="202" y2="28"/>
    <line x1="130" y1="116" x2="100" y2="134"/>
    <line x1="130" y1="116" x2="160" y2="134"/>
  </g>
  <!-- 2-hop ring: masked + target -->
  <g>
    <g fill="none" stroke="#1a1a1a" stroke-width="1.4" stroke-dasharray="3 2.5">
      <circle cx="58" cy="28" r="14"/><circle cx="202" cy="28" r="14"/>
      <circle cx="100" cy="134" r="14"/><circle cx="160" cy="134" r="14"/>
    </g>
    <g fill="#3a3a3a" stroke="#1a1a1a" stroke-width="1.2">
      <circle cx="58" cy="28" r="9"/><circle cx="202" cy="28" r="9"/>
      <circle cx="100" cy="134" r="9"/><circle cx="160" cy="134" r="9"/>
    </g>
  </g>
  <!-- 1-hop visible -->
  <g fill="#ffffff" stroke="#6b7280" stroke-width="1.3">
    <circle cx="92" cy="48" r="11"/><circle cx="168" cy="48" r="11"/>
    <circle cx="130" cy="116" r="11"/>
  </g>
  <!-- focal visible -->
  <circle cx="130" cy="75" r="14" fill="#ffffff" stroke="#1a1a1a" stroke-width="2.2"/>
  <text x="130" y="79" text-anchor="middle" font-size="12" font-style="italic" font-weight="700" fill="#1a1a1a">v</text>
</svg>
