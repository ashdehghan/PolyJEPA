<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 150" font-family="-apple-system,Helvetica Neue,Arial,sans-serif">
  <rect x="0" y="0" width="260" height="150" rx="8" fill="#ffffff"/>
  <!-- community boundary -->
  <ellipse cx="130" cy="75" rx="112" ry="46" fill="#f1f1f1" stroke="#9aa0a6" stroke-width="1.2" stroke-dasharray="4 3"/>
  <text x="130" y="132" text-anchor="middle" font-size="10" fill="#666">same community (no edge between v and u*)</text>

  <!-- a few intra-community edges, but NOT v-u* -->
  <g stroke="#c4c4c4" stroke-width="1.3">
    <line x1="70" y1="64" x2="105" y2="86"/>
    <line x1="190" y1="64" x2="160" y2="86"/>
  </g>
  <g fill="#ffffff" stroke="#6b7280" stroke-width="1.3">
    <circle cx="105" cy="86" r="9"/><circle cx="160" cy="86" r="9"/>
  </g>

  <!-- focal v -->
  <circle cx="70" cy="64" r="14" fill="#ffffff" stroke="#1a1a1a" stroke-width="2.2"/>
  <text x="70" y="68" text-anchor="middle" font-size="12" font-style="italic" font-weight="700" fill="#1a1a1a">v</text>

  <!-- sibling u*: masked + target -->
  <circle cx="190" cy="64" r="17" fill="none" stroke="#1a1a1a" stroke-width="1.5" stroke-dasharray="4 3"/>
  <circle cx="190" cy="64" r="12" fill="#3a3a3a" stroke="#1a1a1a" stroke-width="1.2"/>
  <text x="190" y="68" text-anchor="middle" font-size="10" font-style="italic" fill="#ffffff">u*</text>

  <!-- predict arrow -->
  <defs>
    <marker id="aF" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#555"/>
    </marker>
  </defs>
  <path d="M 84 58 Q 130 30 174 56" fill="none" stroke="#555" stroke-width="1.4" stroke-dasharray="5 3" marker-end="url(#aF)"/>
  <text x="130" y="36" text-anchor="middle" font-size="10" font-style="italic" fill="#555">predict</text>
</svg>
